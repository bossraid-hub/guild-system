<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>BH</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23ff9000'/><text x='16' y='23' font-family='Arial, Helvetica, sans-serif' font-size='18' font-weight='700' text-anchor='middle' fill='%23000000'>BH</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ph: {
              black: '#000000',
              card: '#181818',
              surface: '#242424',
              border: '#333333',
              orange: '#ff9000',
              hover: '#e58200'
            }
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.prod.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-ph-black text-slate-200 min-h-screen p-3 md:p-6 font-sans select-none">
  <div id="app" class="max-w-6xl mx-auto space-y-4">

    <!-- 頂部導覽列 -->
    <header class="bg-ph-card border border-ph-border rounded-2xl p-4 flex justify-between items-center shadow-2xl">
      <div class="flex items-center space-x-3">
        <div class="flex items-center text-xl md:text-2xl select-none" style="font-family: 'Montserrat', Arial, sans-serif;">
          <span class="text-white font-black tracking-tight pr-1">Bossraid</span>
          <span class="bg-ph-orange text-black font-black tracking-tight px-2 py-0.5 rounded-md leading-none flex items-center">hub</span>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <span class="text-xs bg-ph-surface text-ph-orange border border-ph-orange/30 px-2 py-0.5 rounded font-mono font-bold">
              {{ currentWeekKey === 'thisWeek' ? '本週 ' + weekRangeTexts.thisWeek : '下週 ' + weekRangeTexts.nextWeek }}
            </span>
            <span class="text-[10px] flex items-center gap-1 font-mono" :class="syncStatus.color">
              <span class="w-2 h-2 rounded-full animate-pulse" :class="syncStatus.bg"></span>
              {{ syncStatus.text }}
            </span>
          </div>
          <p class="text-[11px] text-slate-400">組隊・刷王・動態週期出勤統計（每週二 00:00 重置）</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button @click="forceCycleShift" title="把下週報名名單直接推進為本週" class="text-xs bg-ph-surface hover:bg-ph-border text-slate-300 font-bold px-3 py-2 rounded-xl border border-ph-border flex items-center gap-1.5 transition">
          <i class="fa-solid fa-arrows-rotate text-ph-orange"></i> 手動推進週次
        </button>
        <button @click="openAddModal" class="text-xs bg-ph-orange hover:bg-ph-hover text-black font-black px-3.5 py-2 rounded-xl flex items-center gap-1.5 transition shadow">
          <i class="fa-solid fa-user-plus"></i> 登記新角色
        </button>
      </div>
    </header>

    <!-- 分頁 Tab -->
    <nav class="flex space-x-2 bg-ph-card p-1.5 rounded-xl border border-ph-border text-xs">
      <button 
        @click="switchTab('signup')"
        :class="currentTab === 'signup' ? 'bg-ph-orange text-black font-black' : 'text-slate-400 hover:text-white'"
        class="px-4 py-2 rounded-lg transition flex items-center gap-1.5 font-bold"
      >
        <i class="fa-regular fa-calendar-check"></i> 每週報名
      </button>
      <button 
        @click="switchTab('list')"
        :class="currentTab === 'list' ? 'bg-ph-orange text-black font-black' : 'text-slate-400 hover:text-white'"
        class="px-4 py-2 rounded-lg transition flex items-center gap-1.5 font-bold"
      >
        <i class="fa-solid fa-list-check"></i> 報名名單
      </button>
    </nav>

    <!-- 分頁 1: 每週報名 -->
    <main v-if="currentTab === 'signup'" class="
